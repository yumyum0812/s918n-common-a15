version: 2.1

jobs:
  build-kernel:
    docker:
      - image: cimg/base:2024.01
    resource_class: large
    environment:
      DEBIAN_FRONTEND: noninteractive
      LTO: "thin"
    steps:
      - checkout

      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update && sudo apt-get install -y \
              build-essential bc bison flex libssl-dev libelf-dev \
              wget lsb-release software-properties-common gnupg \
              git kmod cpio python3 python-is-python3 zstd ccache \
              rsync zip unzip curl device-tree-compiler dwarves

            echo "downloading llvm"
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 14 all
            rm -f llvm.sh

            ls -l /usr/lib/llvm-14/bin
            /usr/lib/llvm-14/bin/clang --version
            /usr/lib/llvm-14/bin/ld.lld --version

      - run:
          name: Build Kernel
          no_output_timeout: 45m
          command: |
            chmod +x ./build.sh
            LTO=thin ./build.sh

      - run:
          name: Collect Artifacts
          command: |
            mkdir -p /tmp/artifacts
            find ./out -maxdepth 3 \( -name "*.zip" -o -name "Image*" -o -name "*.tar*" \) -exec cp -v {} /tmp/artifacts/ \; || true

      - store_artifacts:
          path: /tmp/artifacts
          destination: kernel-output

workflows:
  build:
    jobs:
      - build-kernel
